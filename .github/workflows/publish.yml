name: Publish Plugin

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'The git ref (e.g. a release tag) to publish'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # empty for workflow_dispatch, which checks out the selected ref
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Publish Plugin
        run: >-
          ./gradlew
          clean
          publishPlugins
          -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }}
          -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}
